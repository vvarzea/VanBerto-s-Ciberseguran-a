:where(h1,h2,h3){margin:0;font:inherit;}

@font-face{font-family:'Nunito';src:url(fonts/nunito-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100dvh;overflow:hidden;}
body{
  display:flex;align-items:center;justify-content:center;
  height:100dvh;min-height:100dvh;
  padding:
    max(min(1.5vh,16px), env(safe-area-inset-top,0px))
    max(min(1.5vw,16px), env(safe-area-inset-right,0px))
    max(min(1.5vh,16px), env(safe-area-inset-bottom,0px))
    max(min(1.5vw,16px), env(safe-area-inset-left,0px));
  font-family:'Nunito',sans-serif;
  background:
    radial-gradient(ellipse at 15% 25%,rgba(255,107,53,0.35) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 65%,rgba(80,60,200,0.30) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 90%,rgba(255,180,0,0.20) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 10%,rgba(0,200,150,0.18) 0%,transparent 45%),
    linear-gradient(160deg,#0d0418 0%,#130620 40%,#0a0a20 100%);
}

@media (prefers-reduced-motion: reduce) {
  *{animation:none !important;transition:none !important;}
}
html.no-anim *,html.no-anim *::before,html.no-anim *::after{animation:none !important;transition:none !important;}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.5px 1.5px at 5% 8%,rgba(255,255,255,0.9),transparent),
    radial-gradient(2px 2px at 14% 55%,rgba(255,200,100,0.8),transparent),
    radial-gradient(1.5px 1.5px at 22% 20%,rgba(255,140,80,0.7),transparent),
    radial-gradient(1px 1px at 33% 78%,rgba(100,200,255,0.7),transparent),
    radial-gradient(2px 2px at 41% 38%,rgba(255,255,255,0.85),transparent),
    radial-gradient(1px 1px at 50% 62%,rgba(255,230,150,0.7),transparent),
    radial-gradient(1.5px 1.5px at 58% 12%,rgba(180,255,180,0.7),transparent),
    radial-gradient(1px 1px at 66% 88%,rgba(255,180,255,0.65),transparent),
    radial-gradient(2px 2px at 74% 32%,rgba(255,255,255,0.75),transparent),
    radial-gradient(1px 1px at 82% 68%,rgba(255,220,100,0.65),transparent),
    radial-gradient(1.5px 1.5px at 90% 15%,rgba(255,255,255,0.9),transparent),

}
@keyframes starsTwinkle{0%{opacity:0.5;}50%{opacity:1;}100%{opacity:0.65;}}

.balloon{position:fixed;bottom:-120px;pointer-events:none;animation:balloonRise linear infinite;z-index:10;}
@media(max-height:500px){.hero-icon,.hero-stats,.modal-sub{display:none;}.modal-hero{padding:6px 16px;}}
.reset-btn{align-self:center;margin:14px 0 0;min-height:44px;min-width:44px;background:none;border:1px solid rgba(255,255,255,0.35);color:rgba(255,255,255,0.85);border-radius:20px;padding:6px 14px;font:700 12px 'Nunito',sans-serif;cursor:pointer;flex-shrink:0;}
.reset-btn:focus-visible{outline:2px solid #ffd700;outline-offset:2px;}
.reset-btn[hidden]{display:none;}
@media(max-width:600px){.balloon:nth-of-type(n+4),.confetti-piece{display:none;}}

@keyframes balloonRise{
  0%  {transform:translateY(0) translateX(0px) rotate(-3deg);opacity:0;}
  5%  {opacity:1;}
  50% {transform:translateY(-55vh) translateX(18px) rotate(3deg);}
  85% {opacity:0.7;}

}

.confetti-piece{position:fixed;top:-10px;width:8px;height:8px;opacity:0;pointer-events:none;animation:confettiFall linear infinite;}
@keyframes confettiFall{

  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

  height:100%;max-height:100%;
  display:flex;flex-direction:column;

}
.card{

  border-radius:clamp(12px,1.5vw,24px);overflow:hidden;
  display:flex;flex-direction:column;
  flex:1 1 0;min-height:0;overflow:clip;

    0 0 0 3px #ff6b35, 0 0 0 6px #ffd700, 10px 10px 0 rgba(0,0,0,0.45), 0 0 60px rgba(255,107,53,0.25),

}

.modal-hero{
  background:linear-gradient(160deg,#1f0635,#120428);

  text-align:center;position:relative;overflow:hidden;
  flex-shrink:0;
}
.modal-hero::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 30% 30%,rgba(255,107,53,0.18),transparent 60%),
    radial-gradient(ellipse at 75% 70%,rgba(80,100,255,0.18),transparent 55%),
    radial-gradient(ellipse at 55% 10%,rgba(255,200,0,0.12),transparent 45%),
    radial-gradient(ellipse at 20% 80%,rgba(0,200,150,0.10),transparent 50%);
}
.modal-hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 20%,rgba(255,200,255,0.7),transparent),
    radial-gradient(1px 1px at 30% 60%,rgba(255,230,100,0.6),transparent),
    radial-gradient(2px 2px at 50% 12%,rgba(255,255,255,0.75),transparent),
    radial-gradient(1px 1px at 70% 40%,rgba(150,200,255,0.6),transparent),
    radial-gradient(1.5px 1.5px at 88% 18%,rgba(255,180,255,0.7),transparent);

}

.hero-icon{
  position:relative;z-index:1;
  font-size:min(6vw,6vh,54px);line-height:1;

}

.modal-title{
  font-family:'Fredoka',sans-serif;font-weight:600;

}

.hero-stats{
  display:flex;align-items:center;justify-content:center;

.stat-badge{

  border-radius:20px;padding:clamp(2px,0.4vh,6px) clamp(6px,0.8vw,14px);
  font-family:'Fredoka',sans-serif;font-weight:600;

}

.games-section{
  padding:min(1vh,10px) min(1.8vw,24px) clamp(96px,16vh,120px);
  flex:1 1 0;min-height:0;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;

}
.games-section::-webkit-scrollbar{width:5px;}
.games-section::-webkit-scrollbar-track{background:transparent;}
.games-section::-webkit-scrollbar-thumb{background:rgba(255,107,53,0.45);border-radius:10px;}
.games-section::-webkit-scrollbar-thumb:hover{background:rgba(255,215,0,0.55);}

.section-divider{
  font-family:'Fredoka',sans-serif;font-weight:600;color:#FFD700;

  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.section-divider:first-child{margin-top:min(0.4vh,4px);}
.section-divider::after{
  content:'🌟 🌟 🌟';flex:1;
  font-size:8px;letter-spacing:4px;
  color:rgba(255,215,0,0.25);

  display:flex;align-items:center;

}
.section-count{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;
  background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.40);
  border-radius:20px;padding:2px 8px;color:#FFD700;white-space:nowrap;

.games-grid{display:grid;gap:clamp(7px,0.9vw,14px);flex-shrink:0;}
.games-grid-1{grid-template-columns:1fr;}
.games-grid-2{grid-template-columns:repeat(2,1fr);}
.games-grid-2>.game-card:last-child:nth-child(odd){grid-column:1/-1;}

@media(max-width:480px){
  .games-grid-2{grid-template-columns:1fr;}
}

.game-card{
  background:linear-gradient(145deg,#2a0a4e,#1a0835,#0f0525);
  border:none;
  border-radius:clamp(10px,1.1vw,15px);
  padding:clamp(8px,min(1vw,1.2vh),14px) clamp(10px,1.1vw,16px);
  text-align:left;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:row;align-items:center;gap:clamp(8px,1.2vw,16px);
  transition:transform 0.22s cubic-bezier(.34,1.56,.64,1),box-shadow 0.2s;
  position:relative;overflow:hidden;
  touch-action:manipulation;
  box-shadow:
    0 0 0 2px var(--gc,#ff6b35),
    0 0 0 4px #ffd700,
    4px 4px 0 rgba(0,0,0,0.40),
    0 0 14px var(--gc-glow, rgba(255,107,53,0.18));
}
.game-card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--gc);opacity:0.05;transition:opacity 0.2s;pointer-events:none;}
@media(hover:hover){
.game-card:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 0 0 2px var(--gc,#ff6b35),0 0 0 4px #ffd700,4px 4px 0 rgba(0,0,0,0.40),0 0 24px var(--gc-glow);}
.game-card:hover::before{opacity:0.13;}
.game-card:hover .game-icon-tile{transform:scale(1.12) rotate(-4deg);}
}
.game-card.played .game-name::after{content:' ✓';color:#7ee8a8;}
.game-card:focus-visible{outline:2px solid #ffd700;outline-offset:3px;}

.game-icon-tile{
  flex-shrink:0;
  width:clamp(48px,6.5vw,72px);height:clamp(48px,6.5vw,72px);
  border-radius:clamp(9px,1vw,14px);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,min(2.6vw,3.4vh),36px);line-height:1;
  background:linear-gradient(145deg, var(--gc), #1a0835);
  box-shadow:inset 0 2px 6px rgba(255,255,255,0.20), inset 0 -5px 10px rgba(0,0,0,0.35);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35));
  transition:transform 0.22s cubic-bezier(.34,1.56,.64,1);
}

.game-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.game-name{
  font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:clamp(14px,min(1.1vw,1.5vh),17px);color:#fff;line-height:1.2;
}
.game-desc{
  font-size:clamp(12px,min(0.85vw,1.1vh),13px);color:rgba(255,255,255,0.70);
  font-family:'Nunito',sans-serif;font-weight:700;line-height:1.32;
}
.game-tag{
  align-self:flex-start;
  display:inline-block;background:var(--gc);color:#12041f;
  font-size:12px;font-weight:700;letter-spacing:0.4px;
  padding:2px 8px;border-radius:20px;box-shadow:0 2px 8px var(--gc-glow);margin-top:2px;
}

.games-grid-1 .game-card{padding:clamp(10px,1.3vw,18px) clamp(12px,1.6vw,22px);}
.games-grid-1 .game-icon-tile{width:clamp(56px,8vw,88px);height:clamp(56px,8vw,88px);font-size:clamp(28px,min(3.2vw,4.2vh),44px);}
.games-grid-1 .game-name{font-size:clamp(16px,min(1.4vw,1.9vh),21px);}
.games-grid-1 .game-desc{font-size:clamp(12.5px,min(0.95vw,1.2vh),14px);}

@media(max-width:400px){
  .game-card{flex-direction:column;text-align:center;padding:12px;}
  .game-info{align-items:center;}
  .game-tag{align-self:center;}
}

#fixed-robot-wrap{
  position:absolute;
  bottom:calc(.5rem + env(safe-area-inset-bottom,0px));
  right:calc(.5rem + env(safe-area-inset-right,0px));
  z-index:600;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  pointer-events:auto;
}
#fixed-bubble{
  --bc:#dcebff;
  background:linear-gradient(135deg,var(--bc),#fff);
  border:3px solid #0f172a;outline:2px solid #1e293b;outline-offset:-4px;
  border-radius:16px;padding:6px 10px 5px;
  box-shadow:3px 3px 0 #0f172a;
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
  font-size:clamp(.62rem,1.5vw,.78rem);font-weight:bold;color:#0f172a;
  max-width:180px;min-width:80px;text-align:center;
  pointer-events:none;position:relative;
  opacity:0;transform:translateY(-6px) scale(.88);
  transition:opacity .38s,transform .38s cubic-bezier(.34,1.56,.64,1);
  margin-bottom:4px;
}
#fixed-bubble::after{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid #0f172a;}
#fixed-bubble::before{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid var(--bc);z-index:1;}
#fixed-bubble.show{opacity:1;transform:translateY(0) scale(1);}
#fixed-vb-robot{
  width:clamp(60px,8vw,88px);height:auto;display:block;cursor:pointer;
  animation:vbFloat 3s ease-in-out infinite;
  filter:drop-shadow(0 0 12px #7dd3fc);
}
#fixed-vb-robot:focus-visible{outline:3px solid #ffd700;outline-offset:4px;border-radius:12px;}
#fixed-vb-robot:hover{filter:drop-shadow(0 0 24px #38bdf8);}
#fixed-vb-robot.bounce{animation:robotPop .65s cubic-bezier(.34,1.56,.64,1),vbFloat 3s ease-in-out .65s infinite;}
@keyframes vbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
@keyframes robotPop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-6deg)}70%{transform:translateY(-8px) rotate(5deg)}}
#fixed-robot-name{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(.58rem,1.3vw,.7rem);
  color:#ffa733;text-shadow:0 1px 6px rgba(0,0,0,.8),0 0 10px rgba(236,30,121,.4);
  text-align:center;line-height:1.2;
}
@media(max-width:480px){#fixed-robot-wrap{bottom:calc(.45rem + env(safe-area-inset-bottom,0px));right:calc(.45rem + env(safe-area-inset-right,0px));}#fixed-vb-robot{width:54px;}#fixed-bubble{max-width:150px;font-size:.7rem;}}

#prof-tag{
  position:absolute;left:calc(1.1rem + env(safe-area-inset-left,0px));bottom:calc(.6rem + env(safe-area-inset-bottom,0px));
  z-index:50;font-size:12px;color:rgba(255,255,255,0.8);pointer-events:none;
  background:rgba(10,4,25,0.55);
  padding:3px 10px;border-radius:20px;
  border:1px solid rgba(255,255,255,0.10);
}
/* ===== Estilo "Hora do Código": creme com pontinhos, contornos escuros e sombras de botão ===== */
:root{--ink:#1e1b4b;--sun:#ffd23f;--coral:#ff6b6b;--mint:#2ee6a6;--sky:#4cc9f0;--grape:#7c3aed;--cream:#fff8e7;}
body{background-color:var(--cream);background-image:radial-gradient(rgba(255,150,60,.30) 1.4px,transparent 1.6px);background-size:22px 22px;}
body::before{display:none;}
.card{background:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);}
.modal-hero{background:linear-gradient(#fff,var(--cream));border-bottom:3px solid var(--ink);}
.modal-hero::before,.modal-hero::after{display:none;}
.hero-icon{width:1.5em;height:1.5em;display:flex;align-items:center;justify-content:center;background:var(--sun);border:3px solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink);filter:none;animation:none;}
.modal-title{background:none;-webkit-text-fill-color:currentColor;color:var(--ink);animation:none;font-weight:700;}
.modal-sub{color:var(--grape);opacity:1;font-weight:800;}
.stat-badge{background:var(--sun);border:2px solid var(--ink);color:var(--ink);box-shadow:0 2px 0 var(--ink);}
.stat-badge:nth-child(2){background:var(--mint);}
.stat-badge:nth-child(3){background:var(--sky);}
.stat-badge:nth-child(4){background:#ffb3b3;}
.stat-badge:nth-child(5){background:#d8c7ff;}
.games-section{scrollbar-color:var(--ink) transparent;}
.games-section::-webkit-scrollbar-thumb,.games-section::-webkit-scrollbar-thumb:hover{background:var(--ink);}
.section-divider{color:var(--ink);}
.section-divider::after{content:'';height:0;align-self:center;border-top:3px dotted rgba(30,27,75,.28);padding:0;margin-left:6px;}
.section-count{background:var(--sun);border:2px solid var(--ink);color:var(--ink);}
.game-card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.game-card::before{opacity:.14;}
@media(hover:hover){
.game-card:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink);}
.game-card:hover::before{opacity:.26;}
}
.game-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.game-card:focus-visible{outline:3px solid var(--grape);outline-offset:3px;}
.game-card.played .game-name::after{color:#16a34a;}
.game-icon-tile{background:var(--gc);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);filter:none;}
.game-name{color:var(--ink);}
.game-desc{color:#4a4872;}
.game-tag{color:var(--ink);border:2px solid var(--ink);box-shadow:none;}
.reset-btn{background:#fff;color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);}
.reset-btn:active{transform:translateY(3px);box-shadow:none;}
.reset-btn:focus-visible{outline:3px solid var(--grape);}
#fixed-vb-robot,#fixed-vb-robot:hover{filter:drop-shadow(0 4px 0 rgba(30,27,75,.35));}
#fixed-robot-name{color:var(--ink);text-shadow:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px;box-shadow:0 2px 0 var(--ink);}
#prof-tag{color:var(--ink);background:#fff;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);font-weight:700;}

/* secções que abrem e fecham (só uma aberta de cada vez) */
.sec{flex-shrink:0;margin:min(1vh,9px) 0;}
.sec>summary{list-style:none;cursor:pointer;margin:0;min-height:46px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:6px 12px;font-size:clamp(13px,1.2vw,15px);transition:transform .08s,box-shadow .08s;}
.sec>summary::-webkit-details-marker{display:none;}
.sec>summary::after{display:none;}
.sec>summary:hover{background:#fffbea;}
.sec>summary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.sec>summary:focus-visible{outline:3px solid var(--grape);outline-offset:3px;}
.sec-title{flex:1;min-width:0;}
.sec-arrow{font-size:18px;line-height:1;transition:transform .2s;}
.sec[open]>summary{background:var(--sun);}
.sec[open]>summary .sec-arrow{transform:rotate(180deg);}
.sec[open]>.games-grid{margin-top:10px;margin-bottom:6px;}

/* telemóvel: cabeçalho compacto, sem balão e com o rodapé fora da lista */
@media(max-width:700px){
#fixed-bubble{display:none;}
#prof-tag{position:static;align-self:center;margin-top:8px;flex-shrink:0;font-size:12px;}
.games-section{padding-bottom:70px;}
}

/* botões secundários (Recomeçar / Pausar animações): discretos, como ligações */
.reset-btn{background:none;border:none;box-shadow:none;color:#4a4872;font:700 12px 'Nunito',sans-serif;text-decoration:underline;text-underline-offset:3px;border-radius:10px;padding:6px 12px;margin:6px 0 0;}
.reset-btn:hover{color:var(--ink);background:rgba(255,210,63,.35);}
.reset-btn:active{transform:none;box-shadow:none;background:rgba(255,210,63,.55);}

/* comboio em destaque */
.game-card.comboio{flex-direction:column;align-items:stretch;padding:0;gap:0;overflow:hidden;text-align:center;}
.game-card.comboio::before{display:none;}
.train-canvas{width:100%;display:block;background:linear-gradient(180deg,#5ab4f0 0%,#cdeeff 100%);border-bottom:3px solid var(--ink);}
.comboio-info{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px 12px;}
.game-card.comboio .game-name{font-size:clamp(16px,2vw,20px);}
.card-foot{flex-shrink:0;display:flex;flex-wrap:wrap;justify-content:center;column-gap:10px;padding:0 0 4px;border-top:2px dotted rgba(30,27,75,.2);}
.card-foot .reset-btn{margin:2px 0 0;min-height:40px;}
@media(max-width:700px){.card-foot{padding-right:66px;padding-left:6px;}.card-foot .reset-btn{padding:6px 8px;}}
.comboio-info .game-tag{align-self:center;}
</style>

}

let bubT=null;
function showBub(msg){

const vbRobot=document.getElementById('fixed-vb-robot');

vbRobot.width=96*DPR;vbRobot.height=96*DPR;vbCtx.scale(DPR,DPR);

let vbBusy=false;

function vbSetFrame(blink,step,armsUp){ drawVanBerto(vbCtx,blink,step,armsUp); }
vbSetFrame(false,-1,false);

function vbBlink(){
  if(vbBusy)return;
  vbSetFrame(true,-1,false);
  setTimeout(()=>{ if(!vbBusy) vbSetFrame(false,-1,false); },180);
}

function vbWalk(steps,speed){
  steps=steps||6; speed=speed||170;
  if(vbBusy)return;
  vbBusy=true;
  let i=0;
  const iv=setInterval(()=>{
    vbSetFrame(false, i%2===0?0:1, false);
    i++;
    if(i>=steps){
      clearInterval(iv);
      vbSetFrame(false,-1,false);
      vbBusy=false;
    }
  },speed);
}

function vbJump(){
  if(vbBusy)return;
  vbBusy=true;
  vbRobot.classList.remove('bounce');void vbRobot.offsetWidth;vbRobot.classList.add('bounce');
  vbSetFrame('happy',-1,true);
  setTimeout(()=>{
    vbSetFrame(false,-1,false);
    vbBusy=false;
  },700);
}

setInterval(()=>{
  if(vbBusy||document.hidden||REDUCED||document.documentElement.classList.contains('no-anim'))return;
  const r=Math.random();
  if(r<0.18)vbJump();
  else if(r<0.5)vbWalk();
  else vbBlink();
},3600);

});

      const sampleX=x+S(6), sampleY=bandY+(bandH-sampleH)/2;
      ctx.save();ctx.beginPath();ctx.roundRect(sampleX,sampleY,sampleW,sampleH,S(2));ctx.clip();
      if(w.color){ctx.fillStyle=w.color.h;ctx.fillRect(sampleX,sampleY,sampleW,sampleH);ctx.font=`${sampleH*0.78}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(w.color.emoji,sampleX+sampleW/2,sampleY+sampleH*0.54);}
      ctx.restore();
      ctx.strokeStyle=filled?'#00e676':'rgba(255,255,255,0.40)';ctx.lineWidth=S(1);
      ctx.beginPath();ctx.roundRect(sampleX,sampleY,sampleW,sampleH,S(2));ctx.stroke();
  
      const textX=sampleX+sampleW+S(5), textW=WW-(textX-x)-S(5);
      const capital=w.color?COLOR_CAPITALS[w.color.name]||'':'';
      const nameSize=fitText(w.color?.name||'',textW,Math.min(bandH*0.44,S(13)),S(5));
      ctx.save();ctx.fillStyle=filled?'#00e676':GOLD2;
      ctx.font=`900 ${nameSize}px Fredoka,sans-serif`;
      ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=S(2);
      ctx.fillText(w.color?.name||'',textX,capital?bandY+bandH*0.33:bandY+bandH*0.50);ctx.restore();
      if(capital){
        const capSize=fitText(capital,textW,Math.min(bandH*0.24,S(7.5)),S(3.5));
        ctx.save();ctx.fillStyle='rgba(255,255,255,0.80)';
        ctx.font=`700 ${capSize}px Nunito,sans-serif`;
        ctx.textAlign='left';ctx.textBaseline='middle';
        ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=S(2);
        ctx.fillText(capital,textX,bandY+bandH*0.70);ctx.restore();
      }
      // ✓ pequeno no vagão (não em cima do item)
      if(filled){
        ctx.save();ctx.fillStyle='#00e676';
        ctx.font=`bold ${S(bandH*0.38)}px sans-serif`;
        ctx.textAlign='right';ctx.textBaseline='middle';
        ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=S(3);
        ctx.fillText('✓',x+WW-S(4),bandY+bandH*0.50);ctx.restore();
      }
    } else {
      ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle='#666';
      ctx.font=`${S(bandH*0.5)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🔒',x+WW/2,bandY+bandH*0.5);ctx.restore();
    }
  
    // Plataforma
    const platG2=ctx.createLinearGradient(x,y-WH*0.12,x,y);
    platG2.addColorStop(0,GOLD3);platG2.addColorStop(0.5,GOLD);platG2.addColorStop(1,'#1a0e04');
    rrFill(x+WW*0.01,y-WH*0.12,WW*0.98,WH*0.12,S(2),platG2);
  
    ctx.strokeStyle=filled?'rgba(0,230,118,0.50)':GOLD2;ctx.lineWidth=S(1.5);
    ctx.beginPath();ctx.roundRect(x,bY,WW,WH,S(4));ctx.stroke();
  
    drawGoldenWheel(x+WW*0.20,y,wr2);drawGoldenWheel(x+WW*0.80,y,wr2);
    ctx.save();ctx.strokeStyle='#3a2808';ctx.lineWidth=S(2);
    ctx.beginPath();ctx.moveTo(x+WW*0.20,y);ctx.lineTo(x+WW*0.80,y);ctx.stroke();ctx.restore();
    rrFill(x-WW*0.055,y-WH*0.38,WW*0.055,S(4),S(2),'#666');
    rrFill(x+WW,y-WH*0.38,WW*0.055,S(4),S(2),'#666');
  
    // ══ BANDEIRA POUSADA EM CIMA — fica direita no vagão ══
    if(filled&&w.landedFlag){
      const lf=w.landedFlag;
      const fw=WW*0.62, fh=fw*0.65;
      const fx=x+WW/2-fw/2;
      // Animação de assentar: salta ligeiramente e pousa com bounce
      const anim=w.fillAnim||1;
      const bounceY=anim<1?-Math.sin(anim*Math.PI)*S(10)*(1-anim):0;
      const fy=bY-fh-S(1)+bounceY;
      ctx.save();
      ctx.translate(x+WW/2, fy+fh*0.5);
      ctx.rotate(0); // sempre direita
      ctx.translate(-(x+WW/2), -(fy+fh*0.5));
  
      // Sombra
      ctx.save();ctx.globalAlpha=0.25;ctx.fillStyle='#000';
      ctx.beginPath();ctx.roundRect(fx+S(5),fy+S(5),fw,fh,S(3));ctx.fill();ctx.restore();
  
      // Bandeira
      ctx.save();ctx.beginPath();ctx.roundRect(fx,fy,fw,fh,S(3));ctx.clip();
      drawFlag(lf.color.name,x+WW/2,fy+fh/2,fw,fh);ctx.restore();
  
      // Borda verde (acerto confirmado)
      ctx.strokeStyle='rgba(0,230,118,0.80)';ctx.lineWidth=S(2);
      ctx.beginPath();ctx.roundRect(fx,fy,fw,fh,S(3));ctx.stroke();
  
      // Brilho
      ctx.save();ctx.globalAlpha=0.20;ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath();ctx.roundRect(fx+S(2),fy+S(2),fw-S(4),fh*0.22,S(2));ctx.fill();ctx.restore();
  
      ctx.restore(); // end rotation
  
      // ✓ verde sobre a bandeira pousada
      ctx.save();
      ctx.fillStyle='#00e676';
      ctx.font=`bold ${S(fh*0.38)}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=S(4);
      ctx.fillText('✓',x+WW/2+fw*0.30,fy+fh*0.22);
      ctx.restore();
  
      // Capital em baixo da bandeira pousada (pequena, discreta)
      const capital=w.color?COLOR_CAPITALS[w.color.name]||'':'';
      if(capital){
        const capY=fy+fh+S(4);
        ctx.save();
        // Fundo escuro
        const capSz=S(7.5);
        ctx.font=`700 ${capSz}px Nunito,sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='top';
        const capTxt=capital;
        const capW=ctx.measureText(capTxt).width+S(8);
        ctx.fillStyle='rgba(0,0,0,0.65)';
        ctx.beginPath();ctx.roundRect(x+WW/2-capW/2,capY-S(1),capW,capSz+S(4),S(3));ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.90)';
        ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=S(2);
        ctx.fillText(capTxt,x+WW/2,capY+S(1));
        ctx.restore();
      }
    }
  }

  function trainWheel(x,y,r,ang,col){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.arc(x,y+S(2),r,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle='#24262c';ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r*0.86,0,7);ctx.fillStyle='#2f323a';ctx.fill();
    ctx.lineCap='round';ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.5,r*0.15);
    for(let i=0;i<10;i++){const a=ang+i*Math.PI/5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*0.8,y+Math.sin(a)*r*0.8);ctx.stroke();}
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=Math.max(1,r*0.07);ctx.beginPath();ctx.arc(x,y,r*0.93,Math.PI*1.1,Math.PI*1.6);ctx.stroke();
    const hg=ctx.createRadialGradient(x-r*0.05,y-r*0.05,0,x,y,r*0.27);hg.addColorStop(0,'#fff3b0');hg.addColorStop(1,'#b8860b');
    ctx.beginPath();ctx.arc(x,y,r*0.27,0,7);ctx.fillStyle=hg;ctx.fill();
    ctx.restore();
  }

  function drawGoldenWheel(x,y,r){
    ctx.save();ctx.globalAlpha=0.3;ctx.beginPath();ctx.arc(x,y+S(2),r+S(1),0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.restore();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='#1a1008';ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='#c8952a';ctx.lineWidth=r*0.22;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='#f0c040';ctx.lineWidth=r*0.07;ctx.stroke();
    for(let k=0;k<8;k++){const a=wheelAngle+k*Math.PI/4;const sg=ctx.createLinearGradient(x+Math.cos(a)*r*0.18,y+Math.sin(a)*r*0.18,x+Math.cos(a)*r*0.76,y+Math.sin(a)*r*0.76);sg.addColorStop(0,'#f0c040');sg.addColorStop(1,'#9a7020');ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r*0.16,y+Math.sin(a)*r*0.16);ctx.lineTo(x+Math.cos(a)*r*0.76,y+Math.sin(a)*r*0.76);ctx.strokeStyle=sg;ctx.lineWidth=r*0.15;ctx.lineCap='round';ctx.stroke();}
    const hg=ctx.createRadialGradient(x-r*0.05,y-r*0.05,0,x,y,r*0.2);hg.addColorStop(0,'#f0c040');hg.addColorStop(1,'#7a5010');ctx.beginPath();ctx.arc(x,y,r*0.2,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();ctx.beginPath();ctx.arc(x,y,r*0.09,0,Math.PI*2);ctx.fillStyle='#2a1a04';ctx.fill();
  }

  function drawVanbertoFit(x,y,w,h,mood){
    // robô INTEIRO, nítido (frames 3x), à frente da janela e do farol
    vb.blinkT+=0.012;
    const blinking=Math.sin(vb.blinkT*0.7)>0.96;
    const fr=vbMoodFrame(mood,bgTime,blinking);
    if(!fr)return;
    const sx=24,sy=0,sw=240,sh=288;
    const k=Math.min(h/96,w/80);
    const dw=80*k,dh=96*k;
    const happy=mood==='excited'||mood==='happy'||mood==='wave';
    const bob=mood==='excited'?-Math.abs(Math.sin(bgTime*9))*h*0.06:Math.sin(bgTime*2)*h*0.012;
    const shake=mood==='sad'?Math.sin(bgTime*40)*h*0.02:0;
    const dx=x+w*0.5-dw/2+shake,dy=y+h-dh+bob;
    if(happy){
      const gx=dx+dw/2,gy=dy+dh*0.45,gr=dh*0.75;
      const gg=ctx.createRadialGradient(gx,gy,gr*0.1,gx,gy,gr);
      gg.addColorStop(0,mood==='excited'?'rgba(255,225,90,0.55)':'rgba(120,210,255,0.40)');gg.addColorStop(1,'rgba(255,225,90,0)');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(gx,gy,gr,0,Math.PI*2);ctx.fill();
    }
    ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(fr,sx,sy,sw,sh,dx,dy,dw,dh);
    ctx.restore();
    if(mood==='excited'){  // faíscas à volta
      for(let i=0;i<4;i++){
        const a=bgTime*3+i*1.57,r=dw*(0.55+0.1*Math.sin(bgTime*6+i));
        const px=dx+dw/2+Math.cos(a)*r,py=dy+dh*0.4+Math.sin(a)*r*0.8,sz=S(2.2)*(0.6+0.4*Math.sin(bgTime*8+i));
        ctx.save();ctx.fillStyle='#fff3a0';ctx.shadowColor='#ffd600';ctx.shadowBlur=S(6);
        ctx.beginPath();ctx.moveTo(px,py-sz*2);ctx.lineTo(px+sz*0.6,py-sz*0.6);ctx.lineTo(px+sz*2,py);ctx.lineTo(px+sz*0.6,py+sz*0.6);ctx.lineTo(px,py+sz*2);ctx.lineTo(px-sz*0.6,py+sz*0.6);ctx.lineTo(px-sz*2,py);ctx.lineTo(px-sz*0.6,py-sz*0.6);ctx.closePath();ctx.fill();ctx.restore();
      }
    }
  }

  function vbMoodFrame(mood,t,blinking){
    const up=Math.floor(t*4)%2===0;
    if(mood==='sad')return vbFrame('sad',-1,false);
    if(mood==='excited')return vbFrame('happy',-1,up);
    if(mood==='happy')return vbFrame('happy',-1,false);
    if(mood==='wave')return vbFrame('wink',-1,up);
    return vbFrame(blinking?true:false,-1,false);
  }

  function vbFrame(blink,step,armsUp){
    const k=String(blink)+'|'+step+'|'+(armsUp?1:0);
    if(_vbFrames[k])return _vbFrames[k];
    if(typeof window.drawVBAtual!=='function')return null;
    const c=document.createElement('canvas');c.width=288;c.height=288;
    const g3=c.getContext('2d');g3.scale(3,3);window.drawVBAtual(g3,blink,step,armsUp);
    return _vbFrames[k]=c;
  }

  function rrFill(x,y,w,h,r,fill){if(w<=0||h<=0)return;r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();if(fill!==undefined){ctx.fillStyle=fill;ctx.fill();}}

  function fitText(txt,maxW,maxFs,minFs){let fs=maxFs;ctx.font=`900 ${fs}px Nunito,sans-serif`;while(ctx.measureText(txt).width>maxW&&fs>minFs)fs-=0.5;return fs;}

  function _getFlagCanvas(name, fw, fh) {
    const key = name + '|' + Math.round(fw) + 'x' + Math.round(fh);
    if (_flagCache[key]) return _flagCache[key];
    const entry = _getSVGImg(name);
    if (entry && entry.ready) {
      const oc = document.createElement('canvas');
      oc.width = Math.ceil(fw); oc.height = Math.ceil(fh);
      oc.getContext('2d').drawImage(entry.img, 0, 0, oc.width, oc.height);
      _flagCache[key] = oc;
      return oc;
    }
    // SVG ainda não carregou — placeholder com cor sem guardar em cache
    const tmp = document.createElement('canvas');
    tmp.width = Math.ceil(fw); tmp.height = Math.ceil(fh);
    const c2 = tmp.getContext('2d');
    const col = (typeof COLORS !== 'undefined') ? COLORS.find(x => x.name === name) : null;
    if (col) {
      const fg = c2.createLinearGradient(0,0,fw,fh);
      fg.addColorStop(0, col.mid || col.h); fg.addColorStop(1, col.dark || col.h);
      c2.fillStyle = fg;
    } else { c2.fillStyle = '#555'; }
    c2.fillRect(0, 0, fw, fh);
    return tmp; // NÃO guardar em cache
  }

  function _getSVGImg(name) {
    if (_svgImgCache[name]) return _svgImgCache[name];
    const uri = FLAG_SVGS[name];
    if (!uri) return null;
    const img   = new Image();
    const entry = { img, ready: false, pending: [] };
    _svgImgCache[name] = entry;
    img.onload = () => {
      entry.ready = true;
      Object.keys(_flagCache).forEach(k => { if (k.startsWith(name + '|')) delete _flagCache[k]; });
      entry.pending.forEach(fn => fn());
      entry.pending = [];
    };
    img.onerror = () => { entry.error = true; console.warn('Flag load error:', name); };
    img.src = uri;
    return entry;
  }

  function _drawFlagCore(ct, name, cx, cy, fw, fh) {
    const fc = _getFlagCanvas(name, fw, fh);
    ct.drawImage(fc, cx - fw / 2, cy - fh / 2);
  }

  function drawFlag(name,cx,cy,fw,fh){_drawFlagCore(ctx,name,cx,cy,fw,fh);}

  function updateDrawSmoke(){smokeParticles=smokeParticles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.98;p.vy*=0.99;p.r+=S(0.18);p.life-=p.decay;if(p.life<=0)return false;ctx.save();ctx.globalAlpha=p.life*p.life*0.55;const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);grad.addColorStop(0,p.col+'0.9)');grad.addColorStop(1,p.col+'0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();return true;});}

  // ── cena ──
  const wagons = ['Phishing','Passwords','Firewall'].map(n=>({color:COLORS.find(c=>c.name===n),filled:false,x:0}));

  function resizeTrain(){
    const w = cv.parentElement.clientWidth||660;
    U = Math.min(0.55, 0.88*w/474, Math.max(56,innerHeight*0.17)/168);            // o comboio (locomotiva + 3 vagões) nunca passa de 88% da largura
    W = w; H = Math.round(168*U);
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    WW=Math.round(S(104)); WH=Math.round(S(60)); WG=Math.round(S(8)); LW=Math.round(S(138));
    RAIL_Y = H-Math.round(S(26));
    _flagCache={};
  }
  resizeTrain();
  if(window.ResizeObserver)new ResizeObserver(function(){resizeTrain();pausedKey='';if(TRAIN_REDUCED||document.documentElement.classList.contains('no-anim'))draw();}).observe(cv.parentElement);
  window.addEventListener('resize', ()=>{ resizeTrain(); if(TRAIN_REDUCED) draw(); });

  function drawRail(){
    const y=RAIL_Y, gap=S(34), off=dist%gap;
    ctx.fillStyle='#334155'; ctx.fillRect(0,y+S(16),W,S(4));
    ctx.fillStyle='#78350f';
    for(let dx=-off; dx<W; dx+=gap){ ctx.beginPath(); ctx.roundRect(dx,y+S(13),S(15),S(7),S(1.5)); ctx.fill(); }
    ctx.fillStyle='#64748b'; ctx.fillRect(0,y+S(10),W,S(3));
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(0,y+S(10),W,S(1));
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const bob = k => TRAIN_REDUCED ? 0 : Math.sin(bgTime*10-k*0.7)*S(0.8);
    const total = wagons.length*(WW+WG)+LW+S(26);
    const startX = Math.round((W-total)/2);
    drawRail();
    wagons.forEach((w,i)=>{
      w.x = startX+i*(WW+WG);
      ctx.save(); ctx.translate(0,bob(i+1)); drawNormalWagon(w.x,RAIL_Y,w,i,0,0); ctx.restore();
    });
    ctx.save(); ctx.translate(0,bob(0));
    updateDrawSmoke();
    drawLoco(startX+wagons.length*(WW+WG));
    ctx.restore();
  }

  let pausedKey='';
  function frame(){
    if(document.hidden||!cv.offsetParent){requestAnimationFrame(frame);return;}
    if(document.documentElement.classList.contains('no-anim')){const k=cv.width+'x'+cv.height;if(pausedKey!==k){draw();pausedKey=k;}requestAnimationFrame(frame);return;}
    pausedKey='';
    bgTime += 0.016;
    wheelAngle += 0.075;                         // rodas a rodar para a frente (o comboio segue para a direita)
    const v = 0.075*LW*0.14;                     // velocidade do chão = velocidade das rodas (sem derrapar)
    dist += v;
    smokeParticles.forEach(p=>{ p.x -= v*0.85; });   // o fumo fica para trás
    draw();
    requestAnimationFrame(frame);
  }
  // 1.º quadro só depois de a página inteira correr (o VanBerto's atual é definido mais abaixo)
  requestAnimationFrame(()=>{ if(TRAIN_REDUCED){ draw(); requestAnimationFrame(draw); } else frame(); });
})();
</script>
